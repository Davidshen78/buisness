let lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('suite-lang')||'uk';if(!T[lang])lang='uk';let currentLib='all',currentPrompt=null;const $=id=>document.getElementById(id),keys=Object.keys(libs);
function setText(){const t=T[lang];$('badge').textContent=t.badge;$('hero').textContent=t.hero;$('sub').textContent=t.sub;$('once').textContent=t.once;$('demoBtn').textContent=t.demo;$('demoTitle').textContent=t.demoTitle;$('demoText').textContent=t.demoText;$('libsTitle').textContent=t.libsTitle;$('privateNote').textContent=t.private;$('allBtn').textContent=t.all;$('appSub').textContent=t.appSub;$('search').placeholder=t.search;$('back').textContent=t.back;$('copy').textContent=t.copy;$('download').textContent=t.download;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));renderLibs();renderSide();renderPrompts();localStorage.setItem('suite-lang',lang)}
function getItems(lib){const ks=lib==='all'?keys:[lib];return ks.flatMap(k=>data[lang][k].map((p,i)=>({lib:k,i,title:p[0],desc:p[1],text:p[2]})))}
function renderLibs(){$('libs').innerHTML=keys.map(k=>`<article class="lib" onclick="openLibrary('${k}')"><strong>${libs[k][0]} ${libs[k][1][lang]}</strong><p>${data[lang][k].length} prompts</p></article>`).join('')}
function renderSide(){$('side').innerHTML=keys.map(k=>`<button class="${currentLib===k?'on':''}" onclick="openLibrary('${k}')">${libs[k][0]} ${libs[k][1][lang]}</button>`).join('');$('allBtn').classList.toggle('on',currentLib==='all')}
function renderPrompts(){if(!$('app').classList.contains('open'))return;const q=$('search').value.toLowerCase();const all=getItems(currentLib),items=all.filter(x=>(x.title+' '+x.desc+' '+x.text+' '+libs[x.lib][1][lang]).toLowerCase().includes(q));$('count').textContent=`${T[lang].show} ${items.length} / ${all.length}`;$('prompts').innerHTML=items.map(x=>`<article class="prompt" onclick="openPrompt('${x.lib}',${x.i})"><small>${libs[x.lib][1][lang]}</small><h3>${x.title}</h3><p>${x.desc}</p></article>`).join('')}
function openLibrary(k){currentLib=k;$('landing').classList.add('hide');$('app').classList.add('open');renderSide();renderPrompts();scrollTo(0,0)}
function openPrompt(k,i){currentPrompt=data[lang][k][i];$('modalTitle').textContent=currentPrompt[0];$('modalDesc').textContent=currentPrompt[1];$('modalPrompt').textContent=currentPrompt[2];$('modal').classList.add('show')}
$('close').onclick=()=>{$('modal').classList.remove('show')};$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};$('back').onclick=()=>{$('app').classList.remove('open');$('landing').classList.remove('hide');scrollTo(0,0)};$('allBtn').onclick=()=>openLibrary('all');$('search').oninput=renderPrompts;
$('copy').onclick=async()=>{if(!currentPrompt)return;try{await navigator.clipboard.writeText(currentPrompt[2])}catch(e){const ta=document.createElement('textarea');ta.value=currentPrompt[2];document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const old=T[lang].copy;$('copy').textContent=T[lang].copied;setTimeout(()=>$('copy').textContent=old,1400)};
$('download').onclick=()=>{if(!currentPrompt)return;const blob=new Blob([currentPrompt[2]],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(currentPrompt[0].toLowerCase().replace(/[^a-z0-9а-яіїєґäöüßáéíóúñ]+/gi,'-')||'prompt')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('demoBtn').onclick=()=>{const picks=[['pm',0],['sales',1],['strategy',4]],p=picks[Math.floor(Math.random()*picks.length)];openLibrary(p[0]);setTimeout(()=>openPrompt(p[0],p[1]),80)};
